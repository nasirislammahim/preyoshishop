<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1238"/>
      <stop offset="60%" stop-color="#550A24"/>
      <stop offset="100%" stop-color="#340515"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A2"/>
      <stop offset="35%" stop-color="#D9A441"/>
      <stop offset="70%" stop-color="#B88220"/>
      <stop offset="100%" stop-color="#E9BC58"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF387F"/>
      <stop offset="100%" stop-color="#BE0750"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer elegant border ring with gold gradient -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.85"/>
  <rect x="34" y="34" width="444" height="444" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.45"/>

  <!-- Center emblem grouping -->
  <g transform="translate(256, 210)">
    <!-- Decorative mandala / floral flourish petals in gold -->
    <path d="M 0 -130 C 25 -95 65 -75 90 -40 C 65 -30 35 -35 0 -45 C -35 -35 -65 -30 -90 -40 C -65 -75 -25 -95 0 -130 Z" fill="url(#goldGrad)" opacity="0.2"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#BE0750" stroke-width="1.5" opacity="0.5"/>

    <!-- Royal crown & heart flourish -->
    <path d="M -38 -80 L -22 -62 L 0 -85 L 22 -62 L 38 -80 L 30 -52 L -30 -52 Z" fill="url(#goldGrad)"/>
    <circle cx="-38" cy="-80" r="3.5" fill="#FFF9F2"/>
    <circle cx="0" cy="-85" r="4.5" fill="#FFF9F2"/>
    <circle cx="38" cy="-80" r="3.5" fill="#FFF9F2"/>

    <!-- Stylized Monogram 'P' & Bengali 'প্রে' flourish -->
    <path d="M -28 -38 L 4 -38 C 34 -38 48 -22 48 -2 C 48 20 32 34 2 34 L -12 34 L -12 70 L -28 70 Z M -12 -22 L 2 -22 C 16 -22 28 -14 28 -2 C 28 10 16 18 2 18 L -12 18 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Small Heart Accent in Deep Pink -->
    <path d="M 18 -4 C 18 -10 24 -15 30 -15 C 36 -15 40 -10 40 -5 C 40 8 28 18 18 25 C 8 18 -4 8 -4 -5 C -4 -10 0 -15 6 -15 C 12 -15 18 -10 18 -4 Z" fill="url(#pinkGrad)" transform="translate(18, -4) scale(0.65)"/>
  </g>

  <!-- Typography: PREYOSHI -->
  <text x="256" y="360" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="38" font-weight="700" letter-spacing="9" fill="url(#goldGrad)">PREYOSHI</text>
  
  <!-- Bengali Subtitle: প্রেয়সী শপ -->
  <text x="256" y="405" text-anchor="middle" font-family="'Hind Siliguri', sans-serif" font-size="28" font-weight="600" fill="#FFF9F2" letter-spacing="2">প্রেয়সী শপ</text>

  <!-- Tagline: Your Style ♥ Our Priority -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#D9A441">YOUR STYLE  <tspan fill="#BE0750">♥</tspan>  OUR PRIORITY</text>
</svg>
